version: '3.8'
services:
  mongodb:
    image: mongo:8.0 # Usando a versão especificada
    container_name: ozmap-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example

volumes:
  mongo-data:
    driver: local